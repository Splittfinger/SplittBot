name: Signed macOS release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release tag and credentials
        run: |
          node -e "const p=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v'+p.version) throw new Error('Tag must equal v'+p.version)"
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - run: npm run typecheck
      - run: npm run test
      - run: npm run dist:mac
      - name: Verify notarized artifacts
        run: |
          xcrun stapler validate release/*.dmg
          shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS.txt
      - name: Publish GitHub release
        run: |
          files=(release/*.dmg release/*.zip release/SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --generate-notes --title "SplittBot $GITHUB_REF_NAME"
