name: Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run verify
        env:
          SPLITTBOT_CODEX_BUNDLE_SOURCE: tests/fixtures/fake-codex-runtime.sh
          SPLITTBOT_CODEX_CODE_MODE_HOST_SOURCE: tests/fixtures/fake-codex-runtime.sh
          SPLITTBOT_ALLOW_NON_MACHO_RUNTIME: "1"
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
